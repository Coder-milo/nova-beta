# Configuración Nginx Reverse Proxy para NOVA-CRM
# Ubicación en VPS: /etc/nginx/sites-available/novacrm.conf

server {
    listen 80;
    server_name app.cacenglish.com.co api.cacenglish.com.co;

    # Redirección automática HTTP a HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend Astro SSR (app.cacenglish.com.co)
server {
    listen 443 ssl http2;
    server_name app.cacenglish.com.co;

    # Certificados SSL Let's Encrypt (generados con certbot)
    ssl_certificate /etc/letsencrypt/live/app.cacenglish.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cacenglish.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Tamaño máximo de subida de archivos (HVs y documentos)
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend Spring Boot API (api.cacenglish.com.co)
server {
    listen 443 ssl http2;
    server_name api.cacenglish.com.co;

    ssl_certificate /etc/letsencrypt/live/api.cacenglish.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cacenglish.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
