# Agrupa terminos equivalentes bajo una clave canonica.
# Usado por SkillSynonyms para normalizar tokens antes de comparar.
#
# Un mismo sinonimo no puede aparecer bajo dos claves: SkillSynonyms resuelve
# la primera coincidencia y el resultado dependeria del orden de lectura.
#
# El vocabulario nacio siendo casi solo de TI, que no es a lo que aspira esta
# poblacion: la mayoria apunta a BPO y servicio al cliente bilingue. Los grupos
# de abajo cubren esos oficios; sin ellos, un cargo objetivo como "Bilingual
# Customer Service Representative" se quedaba en un solo token.

