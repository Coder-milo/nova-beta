<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: A4; margin: 0.6in; }
  body { margin: 0; padding: 0; font-family: 'Carlito', sans-serif; color: #000000; }
  table { border-collapse: collapse; }
</style>
</head>
<body>

  <!-- Barra superior bicolor (42% rojo / 58% azul) — tabla en vez de linear-gradient (openhtmltopdf = CSS 2.1) -->
  <table style="width:100%;page-break-inside:avoid;" cellpadding="0" cellspacing="0">
    <tr>
      <td style="width:42%;height:5pt;background:#E1251B;font-size:0;line-height:0;border-top-left-radius:8pt;">&#160;</td>
      <td style="width:58%;height:5pt;background:#1F4E79;font-size:0;line-height:0;border-top-right-radius:8pt;">&#160;</td>
    </tr>
  </table>

  <!-- Header azul: nombre/título a la izquierda, logo blanco a la derecha — tabla en vez de flexbox -->
  <table style="width:100%;background:#1F4E79;page-break-inside:avoid;border-bottom-left-radius:8pt;border-bottom-right-radius:8pt;" cellpadding="0" cellspacing="0">
    <tr>
      <td style="padding:16pt 0 16pt 20pt;vertical-align:middle;">
        <h1 style="margin:0;font-size:20pt;font-weight:700;color:#ffffff;line-height:22pt;letter-spacing:.2pt;">{{FULL_NAME}}</h1>
        <div style="margin-top:7pt;font-size:13pt;font-weight:700;color:#9DB8D8;text-transform:uppercase;line-height:14pt;letter-spacing:.6pt;">{{PROFESSIONAL_TITLE}}</div>
      </td>
      <td style="padding:16pt 20pt 16pt 16pt;vertical-align:middle;text-align:right;width:80pt;">
        <img src="{{LOGO_PATH}}" alt="Logo" style="height:34pt;" />
      </td>
    </tr>
  </table>

  <div style="margin-top:9pt;font-size:11pt;color:#000000;line-height:14pt;text-align:center;">{{CITY_COUNTRY}}&#160;&#160;<span style="color:#E1251B;">|</span>&#160;&#160;{{PHONE}}&#160;&#160;<span style="color:#E1251B;">|</span>&#160;&#160;<a href="{{LINKEDIN_URL}}" style="color:#1F4E79;text-decoration:none;">LinkedIn</a>&#160;&#160;<span style="color:#E1251B;">|</span>&#160;&#160;<a href="{{PORTFOLIO_URL}}" style="color:#1F4E79;text-decoration:none;">Portfolio</a>&#160;&#160;<span style="color:#E1251B;">|</span>&#160;&#160;{{EMAIL}}</div>

  <!-- SECTION:SUMMARY --><!-- /SECTION:SUMMARY -->
  <!-- SECTION:EXPERIENCE --><!-- /SECTION:EXPERIENCE -->
  <!-- SECTION:EDUCATION --><!-- /SECTION:EDUCATION -->
  <!-- SECTION:CERTIFICATIONS --><!-- /SECTION:CERTIFICATIONS -->
  <!-- SECTION:ACHIEVEMENTS --><!-- /SECTION:ACHIEVEMENTS -->
  <!-- SECTION:SKILLS --><!-- /SECTION:SKILLS -->
  <!-- SECTION:LANGUAGES --><!-- /SECTION:LANGUAGES -->

</body>
</html>
