<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial No Encontrada - NOVA CRM</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fef2f2; margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .card { background: white; border-radius: 16px; padding: 2rem; max-width: 500px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align: center; }
        .icon { width: 80px; height: 80px; margin: 0 auto 1rem; background: #fee2e2; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon span { font-size: 2.5rem; }
        h1 { color: #991b1b; font-size: 1.5rem; }
        .footer { margin-top: 2rem; font-size: .75rem; color: #9ca3af; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon"><span>!</span></div>
    <h1 th:if="${revocada}">Credencial Revocada</h1>
    <h1 th:unless="${revocada}">Credencial No Encontrada</h1>
    <p th:if="${revocada}">Esta credencial ha sido revocada y ya no es válida.</p>
    <p th:unless="${revocada}">El enlace que has utilizado no corresponde a una credencial válida. Verifica que el enlace sea correcto.</p>
    <div class="footer">NOVA CRM — CAC Eurocentres</div>
</div>
</body>
</html>
