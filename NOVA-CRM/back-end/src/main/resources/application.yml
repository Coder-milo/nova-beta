spring:
  application:
    name: nova-crm
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${NOVA_DB_NAME:novacrm}${DB_PARAMS:}
    username: ${NOVA_DB_USER:novacrm}
    password: ${NOVA_DB_PASSWORD:novacrm_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.novacrm: DEBUG

app:
  jwt:
    secret: ${NOVA_JWT_SECRET:TlfnNVy2SjMmDUao7a6XpWTBRG4iLr3ZGdveIrsy/o0=}
    expiration-ms: 28800000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
  rate-limit:
    login-max: 5
    login-window-minutes: 1
    api-max: 100
    api-window-minutes: 1
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:novacrm}
  ses:
    region: ${SES_REGION:us-east-1}
    source-email: ${SES_SOURCE_EMAIL:noreply@novacrm.com}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}
