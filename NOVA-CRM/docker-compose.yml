services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacrm
      POSTGRES_USER: novacrm
      POSTGRES_PASSWORD: ${NOVA_DB_PASSWORD:-novacrm_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-novacrm}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-novacrm_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: novacrm
      DB_USER: novacrm
      DB_PASSWORD: ${NOVA_DB_PASSWORD:-novacrm_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-novacrm}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-novacrm_secret}
      JWT_SECRET: "${JWT_SECRET}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-noreply@novacrm.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Servidor SMTP. Con esto la app envia por Brevo, Resend o el correo
      # institucional. Sin host configurado, cae a Amazon SES.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Remitente; los proveedores exigen tenerlo verificado en su panel.
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      CORREO_NOMBRE_REMITENTE: ${CORREO_NOMBRE_REMITENTE:-NOVA - CAC Eurocentres}
      # Imagenes de la plantilla (URLs publicas).
      CORREO_LOGO_URL: ${CORREO_LOGO_URL:-}
      CORREO_BANNER_PIE_URL: ${CORREO_BANNER_PIE_URL:-}
      # Mientras tenga direcciones, SOLO se escribe a ellas. Es la salvaguarda
      # que impide que una prueba termine escribiendo a los 107 participantes.
      # Vaciarla habilita el envio real a todos.
      CORREO_DESTINATARIOS_PERMITIDOS: ${CORREO_DESTINATARIOS_PERMITIDOS:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-https://api.novacrm.com/api/v1/linkedin/callback}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  minio_data:
